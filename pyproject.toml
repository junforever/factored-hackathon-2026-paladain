[project]
name = "ai-banking-customer-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "junforever", email = "dgalvaro@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "strands-agents[openai]>=1.57.1",
]

[project.scripts]
ai-banking-customer-service = "ai_banking_customer_service:main"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
