[project]
name = "ai-banking-customer-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "junforever", email = "dgalvaro@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "strands-agents[openai]>=1.57.1",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
ai-banking-customer-service = "ai_banking_customer_service:main"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["*.md"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
