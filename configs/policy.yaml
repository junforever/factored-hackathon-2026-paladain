auto_block:
  enabled: true
  allowed_product_types:
    - Tarjeta Crédito
    - Tarjeta Débito
  max_amount_usd: 500
  require_merchant_known: true
  max_days_since_transaction: 30

escalation:
  high_amount_threshold_usd: 500
  account_products_require_human: true

governance:
  prompt_injection:
    block: 0.80
    review: 0.35
  social_engineering:
    block: 0.80
    review: 0.35
  min_intent_confidence: 0.35

tool_gating:
  min_intent_matches_tool: 0.65

output_screening:
  min_output_safety_score: 1.50
  min_output_safety_confidence: 0.50
